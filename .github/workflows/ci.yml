# CI — lint, test, and build both sides of DBS-Operations-OS.
#
# Runs once the PR has been approved and merged, on the develop branch as it then stands — the
# integrated code, not the branch in isolation. Two changes that each pass alone and break together
# are caught here, which is the case reviewing a PR cannot see.
#
#   feature/* --PR--> develop --merged locally--> main --> deploy.yml --> Hostinger VPS
#                     ^^^^^^^                             ^^^^^^^^^^
#                     this workflow                       verify, then deploy
#                     (on the merge)
#
# There is no PR into main, so this run is the only report on the code before it is promoted:
# green here is what says develop is safe to merge into main.
#
# This reports rather than blocks: the merge has already happened by the time it runs. Red on
# develop means develop is broken and must be fixed before it is promoted to main — it is not a
# backlog item. The suite is green today (backend 309/309, frontend 72/72, lint clean), so anything
# red here is something the merge that triggered it broke.
name: CI

on:
  push:
    branches: [develop]
  # Lets a run be repeated from the Actions tab — after an environmental failure, say — without
  # pushing an empty commit.
  workflow_dispatch:

# One CI run for develop at a time. Two PRs merged in quick succession cancel the earlier run: the
# later commit contains both changes, so its result is the one that describes the branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default. Nothing in CI writes to the repository.
permissions:
  contents: read

env:
  # Whether a lint or test failure fails the job.
  #
  # Kept as a switch rather than inlined: if develop ever inherits a genuinely unrelated failure
  # that cannot be fixed at once, this can be turned off for a re-run from the Actions tab so the
  # rest of the report is still readable. Put it back to "true" immediately — this workflow is the
  # only thing watching develop, so time spent with it off is time nothing is being checked.
  STRICT: "true"

jobs:
  backend:
    name: Backend (lint-free, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # An empty MySQL created for this run and thrown away with it. test/iam.test.js is not a pure
    # unit suite: it upserts branches, creates roles and users, and reads the seeded permission
    # rows, so it needs a real database with the schema applied.
    #
    # It must never be the production one. Those tests write, and the VPS database holds the
    # studio's live records — quite apart from it being unreachable from a GitHub runner and its
    # password having no business in CI. A throwaway container gives the tests something real to
    # write to that nobody has to care about.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: dbs_ci
        ports:
          - 3306:3306
        # The job must not start until MySQL is accepting connections; without this the first
        # Prisma call races the container's startup and fails intermittently.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
  
    env:
      # Points at the service above, and nowhere else. Credentials for a container that exists for
      # the length of this job, so they are configuration rather than secrets.
      DATABASE_URL: "mysql://root:ci@127.0.0.1:3306/dbs_ci"

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Reads .nvmrc at the repository root so CI and the VPS never drift apart.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        # npm ci installs exactly what package-lock.json pins and fails if the two disagree.
        # Never npm install here — that would silently update the lockfile inside CI.
        run: npm ci

      - name: Generate the Prisma client
        working-directory: backend
        # src/config/db.js imports @prisma/client, which does not exist until it is generated.
        # No database is contacted: generate only reads schema.prisma and writes the client.
        run: npx prisma generate

      - name: Validate the Prisma schema
        working-directory: backend
        # Catches a malformed schema or a migration that does not match it before it reaches
        # `migrate deploy` on production, where a bad migration is far more expensive.
        #
        # This is also the step that needs DATABASE_URL to merely exist: schema.prisma declares
        # `url = env("DATABASE_URL")`, and validate resolves that expression before parsing the
        # file. Without a value it stops at P1012, which is what it did on the first run — the
        # value comes from backend/.env locally, and that file is gitignored, so CI had none.
        run: npx prisma validate

      - name: Build the test database the way production's is
        working-directory: backend
        # MySQL 8 defaults a new database to utf8mb4_0900_ai_ci; the studio's database is
        # utf8mb4_unicode_ci. That difference is not cosmetic here. Most CREATE TABLE statements in
        # prisma/migrations pin the collation, but six tables in
        # 20260904120000_referrals_tasks_and_quotation_link do not and inherit whatever the database
        # default is - so on this container `hrm_task.branch` came out utf8mb4_0900_ai_ci while
        # `branch.name` was utf8mb4_unicode_ci, and the first migration to join the two failed with
        # "Illegal mix of collations". It passed on every developer's machine, where the database
        # was created as utf8mb4_unicode_ci.
        #
        # Run before any table exists, so it only decides what the migrations below create. CI's job
        # is to prove the migrations run against a database like production's; built with a
        # different collation it was proving something else.
        shell: bash
        run: |
          echo 'ALTER DATABASE `dbs_ci` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;' \
            | npx prisma db execute --url "$DATABASE_URL" --stdin

      - name: Apply migrations to the test database
        working-directory: backend
        # deploy, not dev: the same command production runs, against an empty database. It applies
        # all 80 migrations in order, so a migration that cannot run from scratch fails here rather
        # than against the studio's data.
        run: npx prisma migrate deploy

      - name: Seed the test database
        working-directory: backend
        # iam.test.js reads permission rows by module and feature — "ASSET / Asset Management",
        # "ADMIN / User Management" — and expects the SUPER_ADMIN role. All three come from
        # prisma/seeds/iam-roles-permissions.js, which prisma/seed.js runs.
        run: npm run seed

      - name: Run tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then
            {
              echo "### Backend tests — passed"
              grep -E '^ℹ (tests|pass|fail)' test.log || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Backend tests — FAILED"
            grep -E '^ℹ (tests|pass|fail)' test.log || true
            echo ""
            echo "Failing tests:"
            echo '```'
            sed -n '/^✖ failing tests:/,$p' test.log | grep -E '^✖' | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STRICT" = "true" ]; then
            echo "::error::Backend tests failed. develop is broken — fix it before promoting to main."
            exit 1
          fi
          echo "::warning::Backend tests failed, and STRICT is off — develop is broken and this run will not say so."

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          if npm run lint 2>&1 | tee lint.log; then
            echo "### Lint — clean" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Lint — FAILED"
            echo '```'
            tail -40 lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STRICT" = "true" ]; then
            echo "::error::Lint failed. develop is broken — fix it before promoting to main."
            exit 1
          fi
          echo "::warning::Lint failed, and STRICT is off — develop is broken and this run will not say so."

      - name: Run tests
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          if npm test 2>&1 | tee test.log; then
            {
              echo "### Frontend tests — passed"
              grep -E '^ℹ (tests|pass|fail)' test.log || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Frontend tests — FAILED"
            grep -E '^ℹ (tests|pass|fail)' test.log || true
            echo ""
            echo "Failing tests:"
            echo '```'
            sed -n '/^✖ failing tests:/,$p' test.log | grep -E '^✖' | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STRICT" = "true" ]; then
            echo "::error::Frontend tests failed. develop is broken — fix it before promoting to main."
            exit 1
          fi
          echo "::warning::Frontend tests failed, and STRICT is off — develop is broken and this run will not say so."

      - name: Build
        working-directory: frontend
        # The build ignores STRICT and always fails the job. Code that does not compile cannot be
        # deployed at all, so there is no version of "carry on for now" that applies to it.
        #
        # These are build-time placeholders, not secrets. NEXT_PUBLIC_* values are baked into the
        # client bundle, so the real production values belong in the VPS environment file where
        # `npm run build` runs at deploy time — never in this repository.
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ""
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ""
          NEXT_PUBLIC_GOOGLE_PICKER_APP_ID: ""
        run: npm run build

  # One line to read on the develop branch: green means both jobs passed, red means develop is
  # broken, without opening the run to find out which job it was. It fails if any job it needs
  # failed or was skipped.
  #
  # Not a branch-protection check any more. Running on push means the result arrives after the
  # merge, and GitHub can only require a check that runs on the pull request itself.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs succeeded."
