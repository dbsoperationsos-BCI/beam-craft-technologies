# Deploy — ship main to the Hostinger VPS, once a night.
#
# A nightly release train rather than a deploy per push. Merging into main no longer ships on its
# own: whatever is on main at 23:00 IST goes out together, in one window, when the studio is quiet.
#
#   feature/* --PR--> develop --merged locally--> main ---> 23:00 IST ---> Hostinger VPS
#                                                      \
#                                                       `-> workflow_dispatch, for a hotfix
#
# There is no PR into main and so no review or status check in between: the person merging is
# expected to have seen ci.yml go green on develop first. verify below is the last automatic gate.
#
# The steps on the server are the ones already documented in
# docs/project-state/DEPLOYMENT-WORKFLOW.md, executed over SSH instead of by hand.
name: Deploy

on:
  # Beam Craft website: copied from DBS-Operations-OS, whose nightly ship this was. It stays
  # manual-only until this repo has its own server and secrets set up for Beam Craft - a schedule
  # here would try to ship every night to whatever VPS_HOST the repo holds.
#   schedule:
#     # 23:00 IST. GitHub cron is UTC only and has no timezone setting, so this is 17:30 UTC —
#     # writing "0 23" here would ship at 04:30 IST instead. India does not observe daylight saving,
#     # so this stays at 23:00 all year; a UTC-offset country would drift by an hour twice a year.
#     #
#     # GitHub does not promise punctuality for scheduled runs: under load they are queued and can
#     # start appreciably late, and are occasionally dropped. This is a release window, not an alarm.
#     #
#     # A `schedule` only ever runs the copy of this file on the default branch (main), whatever any
#     # other branch holds. Note too that GitHub disables scheduled workflows in a repository with no
#     # activity for 60 days, and mails the owner when it does.
#     #
#     # `1-6` is the weekday field: Monday to Saturday, so nothing ships on a Sunday night. It is
#     # read in UTC like the hour, but 17:30 UTC plus 5:30 is 23:00 on the same day, so UTC Mon-Sat
#     # is IST Mon-Sat with no day shift. That equivalence breaks if this is ever moved past
#     # 18:30 UTC, which would cross midnight into the following IST day.
#     - cron: "30 17 * * 1-6"

#   # The hotfix path, and the only way to ship between windows. Also useful for re-running a deploy
#   # after fixing something in the VPS environment file.
  workflow_dispatch:

# Never let two deploys touch the VPS at once, and never cancel one midway: a deploy
# interrupted between `migrate deploy` and `pm2 restart` leaves production inconsistent.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What this release is called, worked out before anything is built so that every later step —
  # the frontend bundle, the RELEASE file, the health check, the tag — stamps the same string.
  #
  # major.minor comes from the VERSION file and is the one number a person chooses. The build
  # number is the count of promotions to main since the baseline tag, so it advances on its own
  # and cannot be forgotten. scripts/app-version.sh is the only implementation of that rule, and
  # it is the same script you run locally.
  version:
    name: Work out the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # The build number counts commits, so the default shallow clone would count a fraction
          # of them and hand out a version lower than one already deployed.
          fetch-depth: 0
          fetch-tags: true

      - name: Check VERSION and both package.json files agree
        # They may differ in the build number — it moves every release and no commit could keep
        # it accurate — but not in major.minor, which anyone reading package.json would take for
        # the version of the system.
        run: scripts/app-version.sh --check

      - name: Compute the version
        id: compute
        run: |
          set -euo pipefail
          VERSION="$(scripts/app-version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Releasing \`${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a version that already belongs to another commit
        env:
          APP_VERSION: ${{ steps.compute.outputs.version }}
        # Re-running a deploy against the same commit is legitimate and has to keep working — it
        # is the documented fix after correcting the VPS environment file — so a tag already on
        # THIS commit is fine. The same tag on a different commit is not: the build number is
        # derived from history, so that means history moved under the baseline and two different
        # releases now answer to one number.
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAGGED="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAGGED}" != "${GITHUB_SHA}" ]; then
              echo "::error::${TAG} already exists on ${TAGGED}, but this run is ${GITHUB_SHA}. The build number is derived from history and something rewrote it."
              exit 1
            fi
            echo "${TAG} already points at this commit — this is a re-deploy."
          fi

  # Deployability gate, and the last check before production. This does NOT re-run the test
  # suite — ci.yml ran it on develop after each merge, and main only receives what develop held.
  # What this proves is narrower and specific to shipping: the frontend actually compiles, and the
  # Prisma schema is valid so that `migrate deploy` will not fail halfway through against the
  # production database. It runs before the backup and the SSH steps, so a commit that cannot
  # build never touches the VPS.
  verify:
    name: Verify the commit is deployable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Both lockfiles: the repository root holds only an empty stub package-lock.json,
          # so hashing that alone would produce a cache key that never changes.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate the Prisma schema and migrations
        working-directory: backend
        env:
          # Deliberately a dead address, and deliberately not the production database.
          #
          # schema.prisma declares `url = env("DATABASE_URL")`, and `prisma validate` resolves that
          # expression before it will parse the file — with no value at all it stops at P1012. But
          # neither command here opens a connection: generate writes the client from the schema,
          # validate parses it. So this only has to be a well-formed mysql:// URL.
          #
          # The real one stays in the VPS environment file, where `prisma migrate deploy` reads it
          # during the deploy step below. It is never sent to a GitHub runner.
          DATABASE_URL: "mysql://unused:unused@127.0.0.1:3306/unused"
        run: |
          npx prisma generate
          npx prisma validate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_R2_PUBLIC_BASE_URL: ""
          NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ""
          NEXT_PUBLIC_GOOGLE_PICKER_APP_ID: ""
        run: npm run build

  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: [version, verify]
    timeout-minutes: 30

    # Bind the secrets below to a GitHub Environment named "production".
    # Settings > Environments > production is also where that environment says which refs may reach
    # it: set "Deployment branches and tags" to main only. A schedule runs main whatever any other
    # branch holds, but workflow_dispatch is offered on every branch, and without that rule any of
    # them can ship itself to the VPS. Do NOT add a required reviewer — the deploy is scheduled, and
    # an approval gate holds the 23:00 run until somebody presses the button, which ships at
    # whatever hour it was noticed instead. See DEPLOYMENT-WORKFLOW.md, One-time setup.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Back up the production database before migrating
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # No script_stop — see the Deploy step below. `set -euo pipefail` does that job.
          script: |
            set -euo pipefail
            # scripts/production-backup.sh dumps MySQL and the shared uploads, keeping the last 7.
            # `prisma migrate deploy` below is irreversible, so this runs first or not at all.
            if [ -x "${{ secrets.VPS_APP_PATH }}/scripts/production-backup.sh" ]; then
              "${{ secrets.VPS_APP_PATH }}/scripts/production-backup.sh"
            else
              echo "::warning::production-backup.sh not found or not executable — deploying without a fresh backup."
            fi

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          # The exact commit that triggered this run. Deploying a SHA rather than a branch tip
          # means the code on the server is provably the code CI just verified, even if someone
          # pushes to main while this deploy is in flight.
          DEPLOY_SHA: ${{ github.sha }}
          # Computed once by the version job above rather than recomputed here, so the bundle,
          # the RELEASE file, the health check and the tag cannot disagree about what shipped.
          APP_VERSION: ${{ needs.version.outputs.version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_SHA,APP_VERSION
          # Deliberately NOT script_stop: true. Aborting on the first failing command — rather than
          # carrying on and restarting PM2 on a half-applied deploy — is what `set -euo pipefail` at
          # the top of every script here already does, and does correctly.
          #
          # script_stop does it by appending an exit-code check after EVERY line of the script:
          #   DRONE_SSH_PREV_COMMAND_EXIT_CODE=$? ; if [ $... -ne 0 ]; then exit $...; fi;
          # In an `if` whose `then` sits on the next line, that check lands inside the condition
          # list and sees the status of the bare test instead of the finished `if` statement — so a
          # test that merely evaluated false exits the deploy, with no message. It is what failed
          # every run of the health check below between 2026-09-01 and 2026-09-11: `[ -z "$RESPONSE" ]`
          # returning 1 is the backend answering, and script_stop turned that into exit 1.
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.VPS_APP_PATH }}"
            cd "$APP_PATH"

            echo "==> Fetching ${DEPLOY_SHA}"
            git fetch origin main --tags

            # On a night when nothing was merged, the commit on the server is already the one this
            # run would ship. Rebuilding and restarting anyway would drop every open connection for
            # no change at all — so stop here instead. The database backup above has already been
            # taken, and the health check below still runs, which is the useful part of a quiet
            # night. A hotfix via workflow_dispatch on an unchanged main stops here too; push the
            # fix to main first.
            if [ "$(git rev-parse HEAD)" = "${DEPLOY_SHA}" ]; then
              echo "Server is already on ${DEPLOY_SHA} — nothing new to deploy."
              exit 0
            fi
            # reset --hard, not pull: the server tracks main exactly and holds no local edits.
            # Anything manually changed on the server WILL be discarded here, which is the
            # documented rule (production files are never edited directly).
            git reset --hard "${DEPLOY_SHA}"

            echo "==> Recording the release"
            # What this server now is, written where both sides read it back: src/config/version.js
            # serves it from /api/health, and the health check below compares it with the version
            # this run set out to ship. Untracked, so the reset above neither removes nor restores
            # it — writing it immediately afterwards is what keeps it from outliving a failed fetch.
            printf 'VERSION=%s\nCOMMIT=%s\nDEPLOYED_AT=%s\n' \
              "${APP_VERSION}" "${DEPLOY_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$APP_PATH/RELEASE"

            echo "==> Backend: dependencies, Prisma client, migrations"
            cd "$APP_PATH/backend"
            npm ci
            npx prisma generate
            npx prisma migrate deploy

            echo "==> Frontend: dependencies and production build"
            cd "$APP_PATH/frontend"
            npm ci
            # NEXT_PUBLIC_* values are inlined at build time, so the version has to be present
            # for this command and cannot be supplied later. A real environment variable beats
            # frontend/.env.local, which Next.js will not use to overwrite what is already set.
            NEXT_PUBLIC_APP_VERSION="${APP_VERSION}" npm run build

            echo "==> Restarting PM2 processes"
            pm2 restart dbs-erp-backend --update-env
            pm2 restart dbs-erp-frontend --update-env
            pm2 save

            echo "==> Deployed ${APP_VERSION} (${DEPLOY_SHA})"

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_VERSION
          # No script_stop — see the Deploy step above. Every condition below is written with `then`
          # on its own line, which script_stop turns into a failed deploy on a test that is false.
          script: |
            set -euo pipefail
            # PM2 reports "online" the instant the process starts, which is before Express is
            # listening. Poll the real endpoint instead, so a backend that boots and immediately
            # crashes on a bad environment variable fails this deploy loudly.
            RESPONSE=""
            for attempt in $(seq 1 10); do
              if RESPONSE="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:5001/api/health)"
              then
                echo "Backend answering after ${attempt} attempt(s): ${RESPONSE}"
                break
              fi
              echo "Attempt ${attempt}/10 — backend not answering yet, retrying in 3s."
              RESPONSE=""
              sleep 3
            done

            if [ -z "${RESPONSE}" ]
            then
              echo "::error::Backend did not become healthy. Recent logs follow."
              pm2 logs dbs-erp-backend --lines 40 --nostream || true
              exit 1
            fi

            # Answering is not the same as answering with the code this run shipped: a PM2 process
            # that restarted onto the old build looks identical from the outside, and so does one a
            # previous deploy left running. src/config/version.js reads the RELEASE file once when
            # the process boots, so what the endpoint reports is what this process actually started
            # with rather than what the file says now.
            #
            # The comparison is against the RELEASE file rather than against APP_VERSION directly,
            # because on a night when nothing was merged the deploy step above stops before it
            # restarts anything. That is correct — but it also means a server still running a
            # process that booted before this file existed cannot report a version no matter what
            # is written. Warning in that case, and failing only when the record and the running
            # process disagree, keeps a quiet night from failing every night while still catching
            # the restart-that-did-not-take that this check exists for.
            RELEASE_FILE="${{ secrets.VPS_APP_PATH }}/RELEASE"
            if [ ! -f "${RELEASE_FILE}" ]
            then
              echo "::warning::No RELEASE file on the server, so the running release cannot be confirmed. The next deploy that actually ships will write one."
              exit 0
            fi

            RECORDED="$(sed -n 's/^VERSION=//p' "${RELEASE_FILE}" | head -1)"
            if [ "${RECORDED}" != "${APP_VERSION}" ]
            then
              # Impossible on a run that deployed, since it wrote the file moments ago. On a quiet
              # night it means the server is not on the release main now computes to — worth
              # saying, but not worth failing a deploy that changed nothing.
              echo "::warning::The server records release ${RECORDED}, but this run computed ${APP_VERSION}."
            fi

            if printf '%s' "${RESPONSE}" | grep -Fq "\"version\":\"${RECORDED}\""
            then
              echo "Backend is serving ${RECORDED}."
            else
              echo "::error::The server records release ${RECORDED}, but the backend is not serving it. It answered: ${RESPONSE}"
              pm2 logs dbs-erp-backend --lines 40 --nostream || true
              exit 1
            fi

      - name: Report the outcome
        if: always()
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Deployed \`${APP_VERSION}\` (\`${GITHUB_SHA:0:7}\`) to production" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deploy FAILED for \`${APP_VERSION}\` (\`${GITHUB_SHA:0:7}\`)"
              echo ""
              echo "The database backup taken at the start of this run is in \`shared/backups\` on the VPS."
              echo "See docs/deployment/BACKUP-AND-RESTORE.md to roll back."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The tag is written only after the health check passed, so a tag existing means that version
  # genuinely served a request in production — not merely that a deploy was attempted. That makes
  # `git reset --hard v1.0.7` on the VPS a rollback to something known to have worked.
  #
  # A tag, and never a commit. This workflow triggers on `push: branches: [main]`, and a tag push
  # does not match a branch filter. Pushing a version bump back to main — the obvious alternative
  # way to record a release — would retrigger this deploy on itself.
  tag:
    name: Tag the release
    runs-on: ubuntu-latest
    needs: [version, deploy]
    timeout-minutes: 5

    permissions:
      # The only job in either workflow that writes to the repository.
      contents: write

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create and push the tag
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"

          # A re-deploy of a commit that already shipped: the tag is right where it should be.
          if [ "$(git rev-list -n 1 "${TAG}" 2>/dev/null || true)" = "${GITHUB_SHA}" ]; then
            echo "${TAG} already tags this commit — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG} — deployed to production from ${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "### Tagged \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release notes
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        # Never fails the run. The deploy has already succeeded and the tag is already pushed, so
        # notes that could not be written are a cosmetic loss rather than a reason to report a
        # red deploy for a release that is serving traffic.
        continue-on-error: true
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          NOTES="$(mktemp)"

          # Whatever sits under this version's heading in the changelog, up to the next heading.
          awk -v version="${APP_VERSION}" '
            $0 ~ "^## " version "( |$)" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' docs/CHANGELOG.md > "${NOTES}"

          # A build-number-only release usually closed no section, which is expected rather than
          # wrong: the changelog documents changes, and several releases can carry one section.
          if [ ! -s "${NOTES}" ]; then
            printf 'Deployed to production from `%s`.\n\nNo changelog section is headed `%s`; the changes are under the nearest heading above it.\n' \
              "${GITHUB_SHA}" "${APP_VERSION}" > "${NOTES}"
          fi

          gh release create "${TAG}" --title "${TAG}" --notes-file "${NOTES}"
